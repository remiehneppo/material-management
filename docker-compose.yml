version: '3.8'

services:
  material-management-app:
    image: be-material-management
    container_name: material-management-app
    restart: unless-stopped
    ports:
      - "${PORT:-8088}:8088"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PORT=${PORT:-8088}
      - MONGODB_URI=mongodb://admin:admin123@host.docker.internal:27017/
      - MONGODB_DATABASE=${MONGODB_DATABASE}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ISSUER=${JWT_ISSUER}
      - JWT_EXPIRE=${JWT_EXPIRE:-86400}
      - REDIS_URL=host.docker.internal:6379
      - REDIS_USERNAME=${REDIS_USERNAME}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    volumes:
      # Mount working directory for logs and config
      - ./logs:/root/logs
      - ./uploads:/root/uploads
      - ./config.yaml:/root/config.yaml
      # Mount .env file if you want to modify it without rebuilding
      # - ./.env:/root/.env

networks:
  material-management-network:
    driver: bridge